name: build-app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release 标签（与离线包同一 release，如 v1.0.0）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sync app config
        run: node tools/sync-app-config.mjs

      - name: install app deps
        working-directory: app
        run: npm ci

      - name: build mac installers (arm64 + x64)
        working-directory: app
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: app/dist/*.dmg
          if-no-files-found: error

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sync app config
        run: node tools/sync-app-config.mjs

      - name: install app deps
        working-directory: app
        run: npm ci

      - name: build win installer (x64)
        working-directory: app
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: app-win
          path: |
            app/dist/*.exe
            app/dist/*.zip
          if-no-files-found: error

  release:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: create / update release with app installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: dsh-download app installers
          body: |
            DSH Launcher 桌面应用安装包（macOS dmg / Windows exe）。
            应用会自动从同一 release 下载对应平台的离线包。
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
          fail_on_unmatched_files: false
