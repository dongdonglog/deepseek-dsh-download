name: build-offline-x64

on:
  workflow_dispatch:
    inputs:
      dshVersion:
        description: "@deepseek-ai/dsh 版本"
        required: true
        default: "0.1.0-rc.6"
      nodeVersion:
        description: "捆绑的 Node 运行时版本"
        required: true
        default: "24.19.0"
      tag:
        description: "追加到的 GitHub Release 标签（与 build-offline 同一个 tag）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-x64:
    name: bundle darwin-x64 (Intel Mac)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build offline bundle
        run: node tools/build-offline.mjs --platform darwin --arch x64 --dsh-version ${{ inputs.dshVersion }} --node-version ${{ inputs.nodeVersion }}

      - name: smoke test
        run: |
          rm -rf tools/.smoke && mkdir -p tools/.smoke
          unzip -q offline/dsh-offline-darwin-x64-${{ inputs.dshVersion }}.zip -d tools/.smoke/bundle
          node tools/smoke.mjs tools/.smoke/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-darwin-x64
          path: |
            offline/*.zip
            offline/*.sha256
          if-no-files-found: error

  release:
    needs: build-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: merge darwin-x64 into latest.json
        run: node tools/gen-latest.mjs --dsh-version ${{ inputs.dshVersion }} --node-version ${{ inputs.nodeVersion }} --tag ${{ inputs.tag }} --assets-dir artifacts --base latest.json

      - name: commit latest.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: add darwin-x64 bundle to latest.json"
          git push

      - name: append darwin-x64 to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.sha256
